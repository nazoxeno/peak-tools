<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <?!= include('ui/layout/Styles') ?>
  <?!= include('ui/layout/Scripts') ?>
</head>

<body>
  <div class="app">

    <!-- ===== NAVIGATOR (sidebar) — tự sinh từ PAGES trong Router.js ===== -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="<?= baseUrl ?>?page=home">
        <span class="brand-logo">P</span>
        <span class="brand-text">P.E.A.K <small>Internal Tools</small></span>
      </a>

      <nav class="nav">
        <? for (var i = 0; i < pages.length; i++) { var p = pages[i]; ?>
          <a class="nav-item<?= p.id === page.id ? ' active' : '' ?>" href="<?= baseUrl ?>?page=<?= p.id ?>">
            <span class="nav-icon"><?= p.icon ?></span>
            <span class="nav-label"><?= p.title ?></span>
          </a>
        <? } ?>
      </nav>
    </aside>
    <div class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

    <!-- ===== NỘI DUNG TRANG ===== -->
    <main class="content">
      <header class="topbar">
        <button type="button" class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
        <span class="topbar-title"><?= page.icon ?> <?= page.title ?></span>
      </header>

      <div class="wrapper">
        <?!= include(page.view) ?>
      </div>
    </main>
  </div>

  <!-- Popup Live Log Terminal (dùng chung) -->
  <div id="live-terminal">
    <div class="term-head">
      <span>● Live log</span>
      <button type="button" class="term-close" onclick="TaskRunner.hide()" aria-label="Đóng">✕</button>
    </div>
    <div class="term-body" id="term-body"></div>
  </div>
</body>

</html>
