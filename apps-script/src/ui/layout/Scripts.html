<script>
  function toggleSidebar(force) {
    var open = typeof force === 'boolean' ? force : !document.body.classList.contains('nav-open');
    document.body.classList.toggle('nav-open', open);
  }

  function showMessage(el, type, html) {
    el.innerHTML = '<div class="msg msg-' + type + '">' + (type === 'error' ? '❌ ' : '✅ ') + html + '</div>';
  }

  function showLoading(el, text) {
    el.innerHTML = '<span class="loading">' + text + '</span>';
  }

  /**
   * Chạy 1 hàm server có live log.
   * Hàm server phải nhận taskId ở tham số CUỐI và dùng writeLog(taskId, ...).
   *
   * TaskRunner.run({
   *   fn: 'processCloneFromForm',      // tên hàm server
   *   args: [a, b, c],                 // tham số (taskId tự thêm vào cuối)
   *   tag: 'clone',                    // hậu tố taskId
   *   connectMsg: 'Connecting...',
   *   onError: function (err) { return {...} }, // optional: map lỗi thành response
   *   onDone: function (response) {}
   * });
   */
  var TaskRunner = (function () {
    var interval = null;
    var taskId = null;
    var fetching = false;

    function body() { return document.getElementById('term-body'); }

    function render(logs) {
      if (!logs || !logs.length) return;
      var b = body();
      b.innerHTML = logs.join('<br>');
      b.scrollTop = b.scrollHeight;
    }

    function poll() {
      if (!taskId || fetching) return;
      fetching = true;
      google.script.run
        .withSuccessHandler(function (logs) { fetching = false; render(logs); })
        .withFailureHandler(function () { fetching = false; })
        .getLiveLogs(taskId);
    }

    function show() { document.getElementById('live-terminal').classList.add('open'); }
    function hide() { document.getElementById('live-terminal').classList.remove('open'); }

    function run(opts) {
      taskId = Date.now() + '_' + (opts.tag || 'task');
      show();
      body().innerHTML = (opts.connectMsg || 'Connecting to server...') + '<br>';

      clearInterval(interval);
      interval = setInterval(poll, 1000);

      function finish(response) {
        clearInterval(interval);
        if (response && response.logs && response.logs.length) render(response.logs);
        else poll();
        opts.onDone(response);
      }

      var runner = google.script.run
        .withSuccessHandler(finish)
        .withFailureHandler(function (err) {
          finish(opts.onError ? opts.onError(err) : { status: 'error', message: err.message, logs: [] });
        });

      runner[opts.fn].apply(runner, (opts.args || []).concat([taskId]));
    }

    return { run: run, show: show, hide: hide };
  })();
</script>
